<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff9f0a"/>
      <stop offset="1" stop-color="#ff375f"/>
    </linearGradient>
    <radialGradient id="warm" cx="0" cy="0" r="1.4">
      <stop offset="0" stop-color="#ffb340"/>
      <stop offset="0.6" stop-color="#ffb340" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cool" cx="1" cy="1" r="1.3">
      <stop offset="0" stop-color="#bf5af2"/>
      <stop offset="0.55" stop-color="#bf5af2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0.55">
      <stop offset="0" stop-color="#fff" stop-opacity="0.30"/>
      <stop offset="0.32" stop-color="#fff" stop-opacity="0.06"/>
      <stop offset="0.45" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="cookie">
      <rect width="1024" height="1024" fill="#fff"/>
      <circle cx="649.4" cy="241.9" r="80" fill="#000"/>
      <circle cx="752.0" cy="323.5" r="92" fill="#000"/>
      <circle cx="814.6" cy="438.8" r="80" fill="#000"/>
      <ellipse cx="375" cy="440" rx="34" ry="28" transform="rotate(20 375 440)" fill="#000"/>
      <ellipse cx="535" cy="370" rx="28" ry="24" transform="rotate(-15 535 370)" fill="#000"/>
      <ellipse cx="315" cy="595" rx="30" ry="26" transform="rotate(35 315 595)" fill="#000"/>
      <ellipse cx="495" cy="545" rx="36" ry="30" transform="rotate(-25 495 545)" fill="#000"/>
      <ellipse cx="650" cy="605" rx="30" ry="26" transform="rotate(10 650 605)" fill="#000"/>
      <ellipse cx="440" cy="710" rx="32" ry="27" transform="rotate(-40 440 710)" fill="#000"/>
      <ellipse cx="595" cy="740" rx="24" ry="21" transform="rotate(25 595 740)" fill="#000"/>
    </mask>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="22" stdDeviation="26" flood-color="#7a1030" flood-opacity="0.35"/>
    </filter>
    <clipPath id="tile"><rect width="1024" height="1024" rx="230"/></clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="1024" height="1024" fill="url(#base)"/>
    <rect width="1024" height="1024" fill="url(#warm)"/>
    <rect width="1024" height="1024" fill="url(#cool)"/>
    <rect width="1024" height="1024" fill="url(#sheen)"/>
    <g filter="url(#shadow)">
      <circle cx="500" cy="535" r="305" fill="#fff" mask="url(#cookie)"/>
    </g>
  </g>
</svg>
